name: Verificar LikeStudio
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: sudo mkdir -p /usr/local/share/fonts/likestudio && sudo cp public/fonts/*.ttf /usr/local/share/fonts/likestudio/ && sudo fc-cache -f
      - run: npm ci
      - run: npm run check
      - run: npm test
