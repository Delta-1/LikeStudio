<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111015">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="refresh" content="0; url=https://likestudio-production.up.railway.app/">
    <link rel="canonical" href="https://likestudio-production.up.railway.app/">
    <title>LikeStudio — abrindo seu estúdio</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #111015; color: #f6f4fb; }
      main { width: min(100%, 440px); padding: 36px; border: 1px solid #34303e; border-radius: 20px; background: #19181f; text-align: center; }
      h1 { margin: 0 0 12px; font-size: 30px; letter-spacing: -.05em; }
      h1 span { color: #a78bfa; }
      p { margin: 0 0 24px; line-height: 1.6; color: #b6b0c4; }
      a { display: inline-block; padding: 13px 22px; border-radius: 11px; background: #8b5cf6; color: white; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 3px solid #b69afc; outline-offset: 4px; }
    </style>
    <script>window.location.replace("https://likestudio-production.up.railway.app/");</script>
  </head>
  <body>
    <main>
      <h1>like<span>studio.</span></h1>
      <p>Abrindo seu espaço criativo…</p>
      <a href="https://likestudio-production.up.railway.app/">Entrar no LikeStudio</a>
    </main>
  </body>
</html>
